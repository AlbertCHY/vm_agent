# ════════════════════════════════════════════════════════════════
# VM 開立規則 (Policy) 範本
# 使用方式：複製為 policies/vm_defaults.toml 後填入貴單位的實際值。
#           vm_defaults.toml 含內部資訊，已列入 .gitignore；
#           若找不到 vm_defaults.toml，程式會退回讀取本範本。
#
# 模板的欄位、下拉選項 (CPU、記憶體、OS、Cluster、Datastore…) 一律從 Aria 的
# catalog schema 與 Custom Form 讀取，這裡只放 Aria 查不到的業務規則。
# ════════════════════════════════════════════════════════════════

# 使用者沒提到時的預設
[defaults]
sg = "ap"
ip_mode = "DHCP"
# 對應 Custom Form 中 Datastore 選項的 label 開頭 (例如 "HDD" / "SSD (vSAN)")
storage_type = "HDD"

# 自由文字欄位的預設值 (留空代表必須由使用者提供，缺少時會詢問)
[field_defaults]
# DBOwner = ""

# 未指定 deploymentName 時：{project}-{function}{serial}
[naming]
pattern = "{project}-{function}{serial:02d}"
function_max_length = 8

[templates]
# 不讓模型自動選擇的 OS 選項 (例如給外部人員臨時用的 Other)
exclude_os_options = ["Other"]

# ─── 網段：依專案名稱決定 (與 vRO action Project_vLAN 的邏輯一致) ───
[network]
default = "NET_DEFAULT"

# 專案名稱完全符合
[network.by_project]
"proj-demo" = "NET_A01"

# 專案名稱前綴 (不分大小寫)，依序比對
[[network.by_prefix]]
prefix = "a-"
segment = "NET_A02"
